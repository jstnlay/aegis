# Render service definition for the shared DEV/QA AEGIS backend.
#
# This file DESCRIBES the already-running service. The live DEV/QA service was
# created through the Render Dashboard, not from this Blueprint, so applying
# or syncing the Blueprint is not part of the workflow -- Dashboard settings
# are the source of truth at runtime. Keep this file in step with it.
#
# Architecture:
#     Frontend (Cloudflare Pages / Vercel later)
#         -> Render Django (this service)
#             -> Supabase PostgreSQL (external, region ap-southeast-1)
#
# rootDir is backend/aegis_backend because manage.py lives there and because
# the start command imports `config.wsgi` as a top-level module.
#
# Build order is deliberate and load-bearing:
#     pip install -> migrate -> provision_qa_accounts -> seed_qa_dataset
#     -> gunicorn starts
#     provision_qa_accounts writes accounts and seed_qa_dataset hangs records off
#     those accounts, so both must run after migrate and must finish before gunicorn
#     serves traffic. seed_qa_dataset is idempotent and transactional: re-running it
#     on every deploy reuses the existing rows instead of duplicating them, and a
#     failure rolls the whole dataset back rather than leaving a half-seeded school.
#
#     train_risk_model is last because it trains on the data the two steps above
#     create: it computes features from graded, enrolled students and would find
#     none before seed_qa_dataset runs. The model is stored in the database
#     (RiskModelArtifact) because this host has no persistent disk, so without this
#     step every deploy would leave run_risk_computation with nothing to load.
#
#     It is expected to refuse on a dataset too small to train -- the command
#     reports the shortfall and exits 0 rather than persisting a model fitted on
#     too few rows, so a small DEV dataset does not block a deploy. Only a genuine
#     error fails the build, which is correct: if risk training is broken, that
#     should be visible.
#
#     Retraining supersedes the previous artifact. Only one is active per version,
#     enforced by a partial unique constraint.
#
# The shared DEV/QA service intentionally runs config.settings.development
# (DEBUG=True, ALLOWED_HOSTS=["*"]). Production hardening is separate work.

services:
  - type: web
    name: aegis-backend
    runtime: python
    plan: free
    region: singapore
    branch: master
    rootDir: backend/aegis_backend
    buildCommand: >-
      pip install -r ../requirements/production.txt
      && python manage.py migrate --settings=config.settings.development
      && python manage.py provision_qa_accounts --settings=config.settings.development
      && python manage.py seed_qa_dataset --settings=config.settings.development
      && python manage.py train_risk_model --settings=config.settings.development
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    # No healthCheckPath: this Django project exposes no health endpoint, and
    # inventing one would misrepresent the service. Do not add /healthz or
    # /api/v1/health/ without first adding the route to config/urls.py.
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.development
      # Quoted because YAML treats a bare * as an alias indicator.
      - key: DJANGO_DEBUG
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

      # Secrets: declared here so the required variable set is discoverable,
      # but never given a value in this repository. sync: false keeps them in
      # the Render dashboard only.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: QA_SHARED_PASSWORD
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Supabase's pooled user is project-specific (postgres.<project-ref>)
      # and is not recorded anywhere in this repository, so it cannot be
      # written here.
      - key: DATABASE_USER
        sync: false

      # Supabase PostgreSQL (Singapore).
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"

      # The production frontend does not exist yet, so CORS stays on the local
      # Vite dev origins. Add the real frontend origin when it is deployed.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000

      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "30"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"
