# Render service definition for the shared DEV/QA AEGIS backend.
#
# This file DESCRIBES the already-running service. The live DEV/QA service was
# created through the Render Dashboard, not from this Blueprint, so applying
# or syncing the Blueprint is not part of the workflow -- Dashboard settings
# are the source of truth at runtime. Keep this file in step with it.
#
# Architecture:
#     Frontend (Cloudflare Pages / Vercel later)
#         -> Render Django (this service)
#             -> Supabase PostgreSQL (external, region ap-southeast-1)
#             -> Render Strapi (aegis-cms)   -> Supabase PostgreSQL (aegis_cms_db)
#
#     Strapi is the CMS: content is authored in its admin panel and AEGIS
#     reads it server-side through /api/v1/cms/. No browser talks to Strapi
#     directly, which is why the CORS allowlist stays empty.
#
# rootDir is backend/aegis_backend because manage.py lives there and because
# the start command imports `config.wsgi` as a top-level module.
#
# Build order is deliberate and load-bearing:
#     pip install -> migrate -> provision_qa_accounts -> seed_qa_dataset
#     -> gunicorn starts
#     provision_qa_accounts writes accounts and seed_qa_dataset hangs records off
#     those accounts, so both must run after migrate and must finish before gunicorn
#     serves traffic. seed_qa_dataset is idempotent and transactional: re-running it
#     on every deploy reuses the existing rows instead of duplicating them, and a
#     failure rolls the whole dataset back rather than leaving a half-seeded school.
#
#     train_risk_model is last because it trains on the data the two steps above
#     create: it computes features from graded, enrolled students and would find
#     none before seed_qa_dataset runs. The model is stored in the database
#     (RiskModelArtifact) because this host has no persistent disk, so without this
#     step every deploy would leave run_risk_computation with nothing to load.
#
#     It is expected to refuse on a dataset too small to train -- the command
#     reports the shortfall and exits 0 rather than persisting a model fitted on
#     too few rows, so a small DEV dataset does not block a deploy. Only a genuine
#     error fails the build, which is correct: if risk training is broken, that
#     should be visible.
#
#     Retraining supersedes the previous artifact. Only one is active per version,
#     enforced by a partial unique constraint.
#
# The shared DEV/QA service intentionally runs config.settings.development
# (DEBUG=True, ALLOWED_HOSTS=["*"]). Production hardening is separate work.

services:
  - type: web
    name: aegis
    runtime: python
    plan: free
    region: singapore
    branch: master
    rootDir: backend/aegis_backend
    buildCommand: >-
      pip install -r ../requirements/production.txt
      && python manage.py migrate --settings=config.settings.development
      && python manage.py provision_qa_accounts --settings=config.settings.development
      && python manage.py seed_qa_dataset --settings=config.settings.development
      && python manage.py train_risk_model --settings=config.settings.development
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    # No healthCheckPath: this Django project exposes no health endpoint, and
    # inventing one would misrepresent the service. Do not add /healthz or
    # /api/v1/health/ without first adding the route to config/urls.py.
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.development
      # Quoted because YAML treats a bare * as an alias indicator.
      - key: DJANGO_DEBUG
        value: "True"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"

      # Secrets: declared here so the required variable set is discoverable,
      # but never given a value in this repository. sync: false keeps them in
      # the Render dashboard only.
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: QA_SHARED_PASSWORD
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Supabase's pooled user is project-specific (postgres.<project-ref>)
      # and is not recorded anywhere in this repository, so it cannot be
      # written here.
      - key: DATABASE_USER
        sync: false

      # Supabase PostgreSQL (Singapore).
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"

      # The production frontend does not exist yet, so CORS stays on the local
      # Vite dev origins. Add the real frontend origin when it is deployed.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:3000

      # Strapi CMS (Phase 7). Declared so the required variable set is
      # discoverable, but never given a value in this repository. The
      # deployed Django service must know where Strapi lives, which token
      # talks to it, and which secret verifies Strapi's webhook.
      - key: STRAPI_BASE_URL
        sync: false
      - key: STRAPI_API_TOKEN
        sync: false
      - key: STRAPI_WEBHOOK_SECRET
        sync: false

      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "30"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"

  # Strapi 5 CMS service (Phase 7). Content authoring happens in the Strapi
  # admin panel; AEGIS only ever reads it (see cms/config/middlewares.ts):
  # the flow is Browser -> Django -> Strapi, so no browser origin needs CORS
  # and STRAPI_CORS_ORIGINS stays empty (fail-closed in production).
  #
  # rootDir is cms: package.json and strapi.config files live there.
  #
  # Build order matters: install, build the admin panel, start. `strapi start`
  # reads PORT from the environment, which Render sets per deploy, so no PORT
  # variable is declared here. HOST must be 0.0.0.0 or the process binds
  # localhost inside the container and Render's health check never passes
  # (see cms/config/server.ts, where localhost is only a local-dev default).
  #
  # No persistent disk on the free plan: uploaded media (Resource files) is
  # lost on every redeploy unless the optional Supabase Storage provider is
  # configured (SUPABASE_S3_* below); the AEGIS flow works either way. A
  # Strapi instance sleeping on the free tier can also take ~50s to answer
  # the first request after being idle.
  - type: web
    name: aegis-cms
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 0.0.0.0 is required on Render; localhost is the local-dev default.
      - key: HOST
        value: 0.0.0.0

      # Strapi 5 refuses to boot unless every one of these is set
      # (cms/config/admin.ts uses env(...) with no fallback). Use distinct
      # generated values: APP_KEYS is comma-separated.
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

      # Supabase PostgreSQL (Singapore), same host as the Django database.
      # The dedicated role/database are created by
      # backend/scripts/provision_cms_database.py. The connection points at
      # the pooler host, so DATABASE_PORT stays 5432 (the direct host port
      # 6543 is pooler-only and is not what this project uses).
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: aegis_cms_db
      - key: DATABASE_USERNAME
        value: aegis_cms
      - key: DATABASE_PASSWORD
        sync: false
      # Supabase requires TLS. The certificate chain is Supabase's own for
      # direct connections; if the pooled connection is refused for trust
      # reasons, set DATABASE_SSL_REJECT_UNAUTHORIZED=false (a documented
      # corner cut, not a default).
      - key: DATABASE_SSL
        value: "true"
      # Outbound webhook to the Django backend. Both services must carry the
      # same shared secret (server.ts adds it to every outbound header;
      # Django verifies it in constant time).
      - key: AEGIS_WEBHOOK_SECRET
        sync: false
      - key: AEGIS_WEBHOOK_URL
        sync: false

      # Read-only token the Django backend presents to Strapi. Created by the
      # cms/src/index.ts bootstrap ("AEGIS Backend", custom scope, unlimited).
      - key: STRAPI_API_TOKEN
        sync: false

      # Supabase Storage (S3-compatible) for uploads. Optional by design:
      # cms/config/plugins.ts only switches the upload provider to aws-s3
      # when ENDPOINT, BUCKET, ACCESS_KEY and SECRET_KEY are all set,
      # otherwise it silently keeps the local filesystem provider. Setting
      # these on a deployment that already holds local files is therefore
      # additive: existing local media keeps its /uploads URLs, and only new
      # uploads are written to the bucket. When unset, new uploads still
      # behave as before (ephemeral disk).
      #
      # Endpoint: https://<supabase-project-ref>.supabase.co/storage/v1/s3
      # Bucket must already exist (public) before uploads are attempted.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false

