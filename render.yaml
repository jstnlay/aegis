# Render service definition for the AEGIS production backend.
#
# This file DESCRIBES the already-running service. The live service was
# created through the Render Dashboard, not from this Blueprint, so applying
# or syncing the Blueprint is not part of the workflow -- Dashboard settings
# are the source of truth at runtime. Keep this file in step with it.
#
# Architecture:
#     Frontend (Vercel)
#         -> Render Django (this service)
#             -> Supabase PostgreSQL (external, region ap-southeast-1)
#             -> Render Redis (shared throttle cache)
#             -> Render Strapi (aegis-cms) -> Supabase PostgreSQL (aegis_cms_db)
#
#     Strapi is the CMS: content is authored in its admin panel and AEGIS
#     reads it server-side through /api/v1/cms/. No browser talks to Strapi
#     directly, which is why the CORS allowlist stays empty.
#
# rootDir is backend/aegis_backend because manage.py lives there and because
# the start command imports `config.wsgi` as a top-level module.
#
# Build order is deliberate:
#     pip install -> migrate -> gunicorn starts
#
#     migrate reads DJANGO_SETTINGS_MODULE, so it runs under the same
#     production settings as the web process.
#
#     The shared DEV/QA logins (provision_qa_accounts --reset-password) ARE
#     provisioned during the build, so the five accounts exist and accept the
#     documented QA password on every redeploy. The command only ever writes
#     the five allowlisted QA addresses. QA_SHARED_PASSWORD must be set on the
#     service or the build fails loudly.
#
#     QA data seeding (seed_qa_dataset) and risk training (train_risk_model,
#     run_risk_computation) are NOT part of this build. They write a synthetic
#     school and recompute scores, so running them on
#     every deploy overwrites real data. Run them by hand on a DEV/QA
#     environment only; see docs/backend/DEPLOYMENT.md.
#
# The service runs config.settings.production: DEBUG=False, an explicit host
# allow-list, the admin site off, JSON-only rendering, and field encryption
# required. The security-critical values are enforced at start-up, so a
# missing value fails the build instead of serving an insecure deployment.

services:
  - type: web
    name: aegis
    runtime: python
    plan: free
    region: singapore
    branch: master
    rootDir: backend/aegis_backend
    buildCommand: >-
      pip install -r ../requirements/production.txt
      && python manage.py migrate
      && python manage.py provision_qa_accounts --reset-password
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: aegis-0pav.onrender.com
      - key: DJANGO_ENABLE_ADMIN_SITE
        value: "False"

      # Secrets: declared here so the required variable set is discoverable,
      # but never given a value in this repository. sync: false keeps them in
      # the Render dashboard only.
      - key: DJANGO_SECRET_KEY
        sync: false
      # The build provisions the five shared DEV/QA logins, so this must be
      # present or the build fails before the service starts. Never stored in
      # the repository; it lives in the Render dashboard only.
      - key: QA_SHARED_PASSWORD
        sync: false
      # production.py refuses to start without a field encryption key, so
      # chat messages and case notes are never stored in plain text.
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      # The assistant's model. Without a key the service still starts and
      # answers every record question from the database, but free
      # conversation falls back to the school-only tail ("I can look up your
      # grades, attendance and approved learning resources...") and Layer 2
      # classification is off, leaving Layer 1 keywords alone. That is a
      # deliberate degradation, so it is not a build failure; it is declared
      # here because an unset key is otherwise invisible until a student asks
      # the assistant something that is not on their record.
      # GEMINI_API_KEY is the primary; GEMINI_API_KEYS is an optional
      # comma-separated list of fallbacks.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Supabase's pooled user is project-specific (postgres.<project-ref>)
      # and is not recorded anywhere in this repository, so it cannot be
      # written here.
      - key: DATABASE_USER
        sync: false

      # Supabase PostgreSQL (Singapore).
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"

      # The deployed frontend. The backend mails links back to it (password
      # reset, invitations), and the browser needs it in the CORS allowlist.
      - key: CORS_ALLOWED_ORIGINS
        value: https://aegis-frontend-neon.vercel.app
      - key: AEGIS_FRONTEND_URL
        value: https://aegis-frontend-neon.vercel.app

      # Strapi CMS (Phase 7). Declared so the required variable set is
      # discoverable, but never given a value in this repository. The
      # deployed Django service must know where Strapi lives, which token
      # talks to it, and which secret verifies Strapi's webhook.
      - key: STRAPI_BASE_URL
        sync: false
      - key: STRAPI_API_TOKEN
        sync: false
      - key: STRAPI_WEBHOOK_SECRET
        sync: false

      # Uploaded media (profile photos) in Supabase Storage (S3-compatible).
      # The free plan has no persistent disk, so a file written to the
      # service's own disk is lost on the next redeploy. With these set,
      # uploads go to the bucket instead and survive. Declared without values:
      # they live in the Render dashboard only, and without them the app
      # keeps using the local disk.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false

      # Shared throttle cache and outgoing mail (see docs/backend/DEPLOYMENT.md).
      # REDIS_URL points at the Render Redis service; without it the rate limits
      # are enforced per gunicorn worker. EMAIL_BACKEND selects the delivery
      # path: the free compute plan blocks outbound SMTP, so a free-plan
      # deployment sets one of the HTTP backends below. The SMTP EMAIL_* set is
      # for a paid plan. Without EMAIL_BACKEND the service only prints mail to
      # its logs and no invitation, reset or verification link is delivered.
      # Declared without values so the required set is discoverable; the values
      # live in the Render dashboard only.
      - key: REDIS_URL
        sync: false
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_TIMEOUT
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Key for the provider's HTTP API. The free compute plan blocks the
      # outbound SMTP ports, so mail goes over HTTPS through this key.
      - key: RESEND_API_KEY
        sync: false
      # Key for the other provider's HTTP API. Brevo sends from a verified
      # email address, so it is the one that works without a domain.
      - key: BREVO_API_KEY
        sync: false
      # Key for the third provider's HTTP API. Also accepts a single verified
      # email address as a sender.
      - key: SMTP2GO_API_KEY
        sync: false

      - key: JWT_ACCESS_LIFETIME_MINUTES
        value: "30"
      - key: JWT_REFRESH_LIFETIME_DAYS
        value: "7"

      # Import queue (Phase 5). Switched on here so a large import is handed
      # to the `aegis-worker` service below instead of running in the web
      # process. It needs REDIS_URL, which this service already has; the queue
      # definition itself is built from that URL in base.py, so the web
      # process and the worker cannot point at different Redis instances.
      # With this unset (or Redis unreachable) the import still runs in a
      # thread here, which is the documented fallback.
      - key: IMPORT_QUEUE_ENABLED
        value: "true"

  # Import worker (Phase 5). The same image as the web service, run as a
  # worker: a redeploy, a crash or a sleeping instance no longer ends an import
  # that was already accepted, and the job row stops being a side effect of a
  # request that has already returned.
  #
  # It serves no HTTP traffic, so it needs no allowed-host list, mail provider,
  # Strapi token or VAPID key — only what booting production settings and
  # reaching the database and Redis require. `rqworker imports` names the queue
  # in base.py's RQ_QUEUES.
  #
  # It must run on a paid-capable plan if the queue carries real files: a
  # sleeping worker is a job that waits. While it is down, the reaper in
  # runner.py fails a job that sat too long rather than leaving the client
  # polling, so the school sees a failure it can retry instead of a hang.
  - type: worker
    name: aegis-worker
    runtime: python
    plan: free
    region: singapore
    branch: master
    rootDir: backend/aegis_backend
    buildCommand: pip install -r ../requirements/production.txt
    startCommand: python manage.py rqworker imports
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      # production.py refuses to start without a secret key and a host
      # allow-list; a worker never answers a request, but it imports the same
      # settings module.
      - key: DJANGO_ALLOWED_HOSTS
        value: aegis-0pav.onrender.com
      - key: DJANGO_SECRET_KEY
        sync: false
      # Required by the field-encryption start-up check in production.
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      # The database the worker writes to. Same Supabase instance as the web
      # service, because the import writes the school's records.
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Where the jobs come from: the same Redis the web service caches on.
      - key: REDIS_URL
        sync: false

  # Scheduled risk recomputation (Phase 5, D9). Scores used to be recomputed
  # only while deploying, which meant a student's score was as old as the last
  # release. This runs the command that already exists; it exits 0 with a
  # message when there is no trained model or no completed grading period, so
  # a quiet run is not a failed deploy.
  #
  # Render cron schedules are UTC: 18:00 UTC is 02:00 in Asia/Manila, before
  # the school day and after the previous day's records are in.
  #
  # The build installs requirements and does NOT migrate: the web service owns
  # migrations, and two services migrating the same database at 02:00 is a
  # race, not a deployment.
  #
  # A risk alert is dispatched exactly as it is on the web service, so this
  # service carries the same delivery variables. Without them the command still
  # recomputes every score — the alerts simply do not leave, and the in-app
  # notification row is all the recipient gets.
  - type: cron
    name: aegis-risk-recompute
    runtime: python
    plan: free
    region: singapore
    schedule: "0 18 * * *"
    branch: master
    rootDir: backend/aegis_backend
    buildCommand: pip install -r ../requirements/production.txt
    startCommand: python manage.py run_risk_computation
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: aegis-0pav.onrender.com
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEYS
        sync: false
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Alert delivery. Same variables and same values as the web service (see
      # the block there for what each one selects); declared here because a
      # missing EMAIL_BACKEND leaves the SMTP default in place, and Render's
      # free compute plan blocks outbound SMTP — every alert would hang until
      # the socket times out instead of failing fast.
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_TIMEOUT
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP2GO_API_KEY
        sync: false
      # Web Push (Phase 4), for a counselor who turned push on.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      # The alert email links back into the deployed frontend.
      - key: AEGIS_FRONTEND_URL
        value: https://aegis-frontend-neon.vercel.app

  # Strapi 5 CMS service (Phase 7). Content authoring happens in the Strapi
  # admin panel; AEGIS only ever reads it (see cms/config/middlewares.ts):
  # the flow is Browser -> Django -> Strapi, so no browser origin needs CORS
  # and STRAPI_CORS_ORIGINS stays empty (fail-closed in production).
  #
  # rootDir is cms: package.json and strapi.config files live there.
  #
  # Build order matters: install, build the admin panel, start. `strapi start`
  # reads PORT from the environment, which Render sets per deploy, so no PORT
  # variable is declared here. HOST must be 0.0.0.0 or the process binds
  # localhost inside the container and Render's health check never passes
  # (see cms/config/server.ts, where localhost is only a local-dev default).
  #
  # No persistent disk on the free plan: uploaded media (Resource files) is
  # lost on every redeploy unless the optional Supabase Storage provider is
  # configured (SUPABASE_S3_* below); the AEGIS flow works either way. A
  # Strapi instance sleeping on the free tier can also take ~50s to answer
  # the first request after being idle.
  - type: web
    name: aegis-cms
    runtime: node
    plan: free
    region: singapore
    branch: master
    rootDir: cms
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 0.0.0.0 is required on Render; localhost is the local-dev default.
      - key: HOST
        value: 0.0.0.0

      # Strapi 5 refuses to boot unless every one of these is set
      # (cms/config/admin.ts uses env(...) with no fallback). Use distinct
      # generated values: APP_KEYS is comma-separated.
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        sync: false
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: TRANSFER_TOKEN_SALT
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false

      # Supabase PostgreSQL (Singapore), same host as the Django database.
      # The dedicated role/database are created by
      # backend/scripts/provision_cms_database.py. The connection points at
      # the pooler host, so DATABASE_PORT stays 5432 (the direct host port
      # 6543 is pooler-only and is not what this project uses).
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: aegis_cms_db
      - key: DATABASE_USERNAME
        value: aegis_cms
      - key: DATABASE_PASSWORD
        sync: false
      # Supabase requires TLS. The certificate chain is Supabase's own for
      # direct connections; if the pooled connection is refused for trust
      # reasons, set DATABASE_SSL_REJECT_UNAUTHORIZED=false (a documented
      # corner cut, not a default).
      - key: DATABASE_SSL
        value: "true"
      # Outbound webhook to the Django backend. Both services must carry the
      # same shared secret (server.ts adds it to every outbound header;
      # Django verifies it in constant time).
      - key: AEGIS_WEBHOOK_SECRET
        sync: false
      - key: AEGIS_WEBHOOK_URL
        sync: false

      # Read-only token the Django backend presents to Strapi. Created by the
      # cms/src/index.ts bootstrap ("AEGIS Backend", custom scope, unlimited).
      - key: STRAPI_API_TOKEN
        sync: false

      # Supabase Storage (S3-compatible) for uploads. Optional by design:
      # cms/config/plugins.ts only switches the upload provider to aws-s3
      # when ENDPOINT, BUCKET, ACCESS_KEY and SECRET_KEY are all set,
      # otherwise it silently keeps the local filesystem provider. Setting
      # these on a deployment that already holds local files is therefore
      # additive: existing local media keeps its /uploads URLs, and only new
      # uploads are written to the bucket. When unset, new uploads still
      # behave as before (ephemeral disk).
      #
      # Endpoint: https://<supabase-project-ref>.supabase.co/storage/v1/s3
      # Bucket must already exist (public) before uploads are attempted.
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_BUCKET
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false

