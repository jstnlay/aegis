# Continuous integration for AEGIS.
#
# Runs on every push and pull request. The backend job and the frontend job
# need no service: the backend suite uses config.settings.test, which is
# in-memory SQLite, and the frontend suite runs in jsdom. No PostgreSQL, no
# Redis, no Strapi. The end-to-end job (Phase 7) starts its own Django on a
# throwaway SQLite file and needs only a browser.
#
# The backend job calls `scripts/run_tests.py` rather than `manage.py test`
# directly. That script pins DJANGO_SETTINGS_MODULE before Django starts, so
# the run cannot silently fall back to development settings - which would
# throttle login at 15/min per IP and fail the suite in a way that reads as an
# audit-write defect rather than a configuration mistake. See
# docs/PH11_QA_TEST_LOG_REMEDIATION_CYCLE_3.md section 11.1.

name: CI

on:
  push:
    branches: ["master", "cycle-3-remediation"]
  pull_request:

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # config/settings/base.py reads this with no default (python-decouple),
      # so the suite cannot even import without it. A throwaway value is
      # correct here: the test settings never sign a real token or serve a
      # request, and the value must not be a real secret.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key
      # The script also sets this; declared here so the job is readable on its
      # own and so any direct manage.py call in this file is equally safe.
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the documented project baseline, "Python: 3.14.0" in
          # docs/PH9.0_DISCOVERY_REPORT.md, which is also the version the
          # dependency set has actually been exercised on. Keep this in step
          # with that document rather than with whatever is newest on the
          # runner image.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Django system checks
        run: python aegis_backend/manage.py check

      - name: Tests
        run: python scripts/run_tests.py -v 2

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails on a broken manifest, a missing icon or a worker that lost its
      # push handler — all invisible until a phone refuses to install the app
      # (Phase 7).
      - name: Installability check
        run: npm run check:pwa

  # Phase 7. The unit suites prove the parts; this proves the whole path in a
  # browser: sign in, land on the role's own dashboard, open its core screen,
  # sign out — once per role. It builds the frontend and starts Django itself
  # (see frontend/playwright.config.ts), so there is no extra setup here beyond
  # the browser and the seed password.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # The password seed_phase7_e2e.py gives the e2e.* accounts. It reaches
      # the server the config starts and the spec that signs in; the spec
      # refuses to run without it, so this cannot silently skip.
      PHASE7_E2E_PASSWORD: ci-only-e2e-password
      # The config starts Django with config.settings.test and its own SQLite
      # file, so the only thing that has to match here is the secret base.py
      # reads with no default.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements/development.txt
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Role journeys
        run: npm run e2e

      # The trace, screenshot and HTML report from a failed journey. Worth the
      # upload: a browser failure is otherwise a line of text and a guess.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
